<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .class-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .stereotype { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-style: italic; fill: #f1f5f9; text-anchor: middle; }
      .member-text { font-family: "Cascadia Code", Consolas, monospace; font-size: 11px; fill: #1e293b; }
      .link { stroke: #64748b; stroke-width: 1.5; fill: none; }
      .dashed-link { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow); }
      .composition { stroke: #334155; stroke-width: 1.5; fill: none; marker-start: url(#diamond); }
      .generalization { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#triangle); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="diamond" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 5, 5 0, 10 5, 5 10" fill="#1e293b" />
    </marker>
    <marker id="triangle" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="1000" height="680" fill="#f8fafc" rx="8" />

  <text x="40" y="40" class="title">Diagrama de Clases UML · PSP0 Programa 1 — Media y Desviación Estándar</text>
  <text x="40" y="62" class="subtitle">Diseño orientado a objetos con Dominio desacoplado, estructura de lista enlazada propia y separación en capas</text>

  <!-- PROGRAM (Entry Point) -->
  <g transform="translate(40, 90)" filter="url(#shadow)">
    <rect width="160" height="70" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    <path d="M 0 4 Q 0 0 4 0 L 156 0 Q 160 0 160 4 L 160 26 L 0 26 Z" fill="#1e3a8a" />
    <text x="80" y="13" class="stereotype">«entry point»</text>
    <text x="80" y="24" class="class-header">Program</text>
    <text x="10" y="52" class="member-text">+Main(args): int</text>
  </g>

  <!-- APLICACION -->
  <g transform="translate(40, 190)" filter="url(#shadow)">
    <rect width="240" height="100" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    <path d="M 0 4 Q 0 0 4 0 L 236 0 Q 240 0 240 4 L 240 26 L 0 26 Z" fill="#b45309" />
    <text x="120" y="13" class="stereotype">«static»</text>
    <text x="120" y="24" class="class-header">Aplicacion</text>
    <text x="10" y="45" class="member-text">+Exito: int = 0</text>
    <text x="10" y="60" class="member-text">+ErrorDatos: int = 1</text>
    <line x1="0" y1="67" x2="240" y2="67" stroke="#e2e8f0" />
    <text x="10" y="85" class="member-text">+Ejecutar(args, in, out): int</text>
  </g>

  <!-- CONSOLA UI -->
  <g transform="translate(40, 330)" filter="url(#shadow)">
    <rect width="250" height="150" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    <path d="M 0 4 Q 0 0 4 0 L 246 0 Q 250 0 250 4 L 250 26 L 0 26 Z" fill="#0284c7" />
    <text x="125" y="13" class="stereotype">«ui»</text>
    <text x="125" y="24" class="class-header">ConsolaUI</text>
    <text x="10" y="44" class="member-text">-entrada: TextReader</text>
    <text x="10" y="58" class="member-text">-salida: TextWriter</text>
    <line x1="0" y1="65" x2="250" y2="65" stroke="#e2e8f0" />
    <text x="10" y="82" class="member-text">+MostrarEncabezado(): void</text>
    <text x="10" y="98" class="member-text">+PedirRuta(): string</text>
    <text x="10" y="114" class="member-text">+MostrarResultado(r, res): void</text>
    <text x="10" y="130" class="member-text">+MostrarError(msg): void</text>
  </g>

  <!-- LECTOR ARCHIVO NUMEROS -->
  <g transform="translate(350, 90)" filter="url(#shadow)">
    <rect width="250" height="100" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    <path d="M 0 4 Q 0 0 4 0 L 246 0 Q 250 0 250 4 L 250 26 L 0 26 Z" fill="#7e22ce" />
    <text x="125" y="13" class="stereotype">«static»</text>
    <text x="125" y="24" class="class-header">LectorArchivoNumeros</text>
    <text x="10" y="45" class="member-text">+Leer(ruta): ListaEnlazada</text>
    <text x="10" y="62" class="member-text">+LeerLineas(seq): ListaEnlazada</text>
    <line x1="0" y1="70" x2="250" y2="70" stroke="#e2e8f0" />
    <text x="10" y="88" class="member-text">-Convertir(txt, num): double</text>
  </g>

  <!-- CALCULADORA ESTADISTICA -->
  <g transform="translate(340, 240)" filter="url(#shadow)">
    <rect width="270" height="120" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    <path d="M 0 4 Q 0 0 4 0 L 266 0 Q 270 0 270 4 L 270 26 L 0 26 Z" fill="#15803d" />
    <text x="135" y="13" class="stereotype">«static»</text>
    <text x="135" y="24" class="class-header">CalculadoraEstadistica</text>
    <text x="10" y="44" class="member-text">+MinimoParaDesviacion: int = 2</text>
    <line x1="0" y1="52" x2="270" y2="52" stroke="#e2e8f0" />
    <text x="10" y="70" class="member-text">+Media(datos): double</text>
    <text x="10" y="88" class="member-text">+DesviacionEstandar(datos): double</text>
    <text x="10" y="106" class="member-text">+Calcular(datos): Resultado</text>
  </g>

  <!-- RESULTADO ESTADISTICO -->
  <g transform="translate(340, 410)" filter="url(#shadow)">
    <rect width="250" height="85" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    <path d="M 0 4 Q 0 0 4 0 L 246 0 Q 250 0 250 4 L 250 26 L 0 26 Z" fill="#15803d" />
    <text x="125" y="13" class="stereotype">«record»</text>
    <text x="125" y="24" class="class-header">ResultadoEstadistico</text>
    <text x="10" y="44" class="member-text">+Cantidad: int</text>
    <text x="10" y="60" class="member-text">+Media: double</text>
    <text x="10" y="76" class="member-text">+DesviacionEstandar: double?</text>
  </g>

  <!-- LISTA ENLAZADA -->
  <g transform="translate(680, 240)" filter="url(#shadow)">
    <rect width="260" height="150" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    <path d="M 0 4 Q 0 0 4 0 L 256 0 Q 260 0 260 4 L 260 26 L 0 26 Z" fill="#15803d" />
    <text x="130" y="13" class="stereotype">«IEnumerable&lt;double&gt;»</text>
    <text x="130" y="24" class="class-header">ListaEnlazada</text>
    <text x="10" y="44" class="member-text">-_primero: Nodo?</text>
    <text x="10" y="60" class="member-text">-_ultimo: Nodo?</text>
    <text x="10" y="76" class="member-text">+Cantidad: int</text>
    <text x="10" y="92" class="member-text">+EstaVacia: bool</text>
    <line x1="0" y1="99" x2="260" y2="99" stroke="#e2e8f0" />
    <text x="10" y="117" class="member-text">+Agregar(valor: double): void</text>
    <text x="10" y="135" class="member-text">+GetEnumerator(): IEnumerator</text>
  </g>

  <!-- NODO -->
  <g transform="translate(680, 440)" filter="url(#shadow)">
    <rect width="240" height="95" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    <path d="M 0 4 Q 0 0 4 0 L 236 0 Q 240 0 240 4 L 240 26 L 0 26 Z" fill="#15803d" />
    <text x="120" y="13" class="stereotype">«class»</text>
    <text x="120" y="24" class="class-header">Nodo</text>
    <text x="10" y="45" class="member-text">+Valor: double</text>
    <text x="10" y="62" class="member-text">+Siguiente: Nodo?</text>
    <line x1="0" y1="70" x2="240" y2="70" stroke="#e2e8f0" />
    <text x="10" y="87" class="member-text">+Nodo(valor: double)</text>
  </g>

  <!-- EXCEPCIONES -->
  <g transform="translate(680, 90)" filter="url(#shadow)">
    <rect width="250" height="65" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    <path d="M 0 4 Q 0 0 4 0 L 246 0 Q 250 0 250 4 L 250 26 L 0 26 Z" fill="#991b1b" />
    <text x="125" y="13" class="stereotype">«exception»</text>
    <text x="125" y="24" class="class-header">DatosInvalidosException</text>
    <text x="10" y="45" class="member-text">+Linea: int?</text>
    <text x="10" y="58" class="member-text">+DatosInvalidosException(msg, lin)</text>
  </g>

  <!-- Conexiones -->
  <path d="M 120 160 L 120 190" class="dashed-link" />
  <path d="M 160 290 L 160 330" class="dashed-link" />
  <path d="M 280 230 L 350 160" class="dashed-link" />
  <path d="M 280 250 L 340 270" class="dashed-link" />
  <path d="M 610 280 L 680 280" class="dashed-link" />
  <path d="M 470 360 L 470 410" class="dashed-link" />
  <path d="M 800 390 L 800 440" class="composition" />

  <!-- Leyenda de colores -->
  <g transform="translate(40, 580)">
    <rect x="0" y="0" width="16" height="16" fill="#1e3a8a" rx="2" />
    <text x="24" y="13" class="box-text">Punto de entrada</text>
    <rect x="150" y="0" width="16" height="16" fill="#b45309" rx="2" />
    <text x="174" y="13" class="box-text">Aplicación</text>
    <rect x="280" y="0" width="16" height="16" fill="#0284c7" rx="2" />
    <text x="304" y="13" class="box-text">Presentación</text>
    <rect x="420" y="0" width="16" height="16" fill="#7e22ce" rx="2" />
    <text x="444" y="13" class="box-text">Infraestructura</text>
    <rect x="560" y="0" width="16" height="16" fill="#15803d" rx="2" />
    <text x="584" y="13" class="box-text">Dominio</text>
    <rect x="680" y="0" width="16" height="16" fill="#991b1b" rx="2" />
    <text x="704" y="13" class="box-text">Excepciones</text>
  </g>
</svg>
